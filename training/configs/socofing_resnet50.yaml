# Отпечаток SOCOFing (синтетические искажения), ResNet-50 (эталонный). Неделя 7, базовая конфигурация (раздел 8).
# Остальные параметры — DEFAULTS в training/train.py; переопределить: --set key=value
modality: fingerprint_socofing
backbone: resnet50
pretrained: true
fp_input: clahe           # gabor — абляция
embedding_dim: 512
arcface_s: 30.0
arcface_m: 0.5
margin_warmup_epochs: 3
epochs: 30
batch_size: 32
lr: 1.0e-3                # проекция + ArcFace; backbone = lr * backbone_lr_mult
backbone_lr_mult: 0.1
weight_decay: 1.0e-2
amp: true                 # на GTX 16xx код сам выключает (fp16 там даёт NaN)
num_workers: 4
patience: 8
seed: 42
mlflow_experiment: unimodal
